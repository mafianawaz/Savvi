name: savvi
description: "Savvi — Food Support member app (Flutter production frontend)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # State management
  get: ^4.7.3
  riverpod_annotation: ^2.3.5
  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0
  video_player: ^2.9.0

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Localization / formatting
  intl: ^0.20.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  onesignal_flutter: ^5.7.2
  # UI and utilities
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  mobile_scanner: ^7.4.0
  google_fonts: ^6.2.0
  package_info_plus: any
  qr_flutter: ^4.1.0

  # Firebase
  firebase_core: ^3.6.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/blue_app_icon.jpg"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/images/
    - assets/fonts/
    - assets/animations/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans_18pt-Thin.ttf
          weight: 100
        - asset: assets/fonts/DMSans_18pt-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/DMSans_18pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/DMSans_18pt-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/DMSans_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/DMSans_18pt-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/DMSans_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans_18pt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/DMSans_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans_18pt-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/DMSans_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans_18pt-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/DMSans_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans_18pt-BoldItalic.ttf
          weight: 700
        - asset: assets/fonts/DMSans_18pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/DMSans_18pt-ExtraBoldItalic.ttf
          weight: 800
        - asset: assets/fonts/DMSans_18pt-Black.ttf
          weight: 900
        - asset: assets/fonts/DMSans_18pt-BlackItalic.ttf
          weight: 900
          style: italic

    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
        - asset: assets/fonts/DMSerifDisplay-Italic.ttf
          style: italic
